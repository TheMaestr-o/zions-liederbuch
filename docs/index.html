Feierlich erhabne Zeiten"}, {"n": 325, "t": "Wohin wollt ihr Pilger"}, {"n": 326, "t": "Folg' keiner Versuchung"}, {"n": 327, "t": "Meister, es toben die Winde"}, {"n": 328, "t": "Steh' fest in Versuchung und kämpfe recht treu!"}, {"n": 329, "t": "Wir bau'n auf den Fels!"}, {"n": 330, "t": "Wer will mit uns nach Zion gehen?"}, {"n": 331, "t": "Glauben heisst- die Gnad` erkennen"}, {"n": 332, "t": "Bin ich ein Streiter für den Herrn?"}, {"n": 333, "t": "Glaubest du an Gott, den Herrn?"}, {"n": 334, "t": "O Christ, wache auf!"}, {"n": 335, "t": "Steht auf, steht auf zum Streite"}, {"n": 336, "t": "Nicht nur streiten, überwinden"}, {"n": 337, "t": "Bist du Christi Streiter?"}, {"n": 338, "t": "Ein Fremdling hier auf Erden"}, {"n": 339, "t": "Gäste und Fremdlinge sind wir!"}, {"n": 340, "t": "Es braust ein Ruf von Himmelshöhn"}, {"n": 341, "t": "Noch ein wenig Schweiss und Thränen"}, {"n": 342, "t": "Gib dich nur zufrieden"}, {"n": 343, "t": "Fass Mut, müdes Herz"}, {"n": 344, "t": "Wenn Friede mit Gott meine Seele durchdringt"}, {"n": 345, "t": "Mensch, wenn von deiner Last bedrückt"}, {"n": 346, "t": "Glaube einfach jeden Tag!"}, {"n": 347, "t": "In Gott find' ich Zuflucht und Ruh'"}, {"n": 348, "t": "Wie oft sind die Schatten so schwer"}, {"n": 349, "t": "Das Leben ist oft trübe"}, {"n": 350, "t": "Ein kleines Schiff war auf der See"}, {"n": 351, "t": "Es ist noch Raum zum Ankern"}, {"n": 352, "t": "Der Herr ist mein Hirte"}, {"n": 353, "t": "Mein Schifflein geht behände"}, {"n": 354, "t": "Wir weilen bei dem Lebenswasser"}, {"n": 355, "t": "Herzen einsam gibt`s zu trösten"}, {"n": 356, "t": "Licht nach dem Dunkel"}, {"n": 357, "t": "Wir begegnen uns einst drüben"}, {"n": 358, "t": "Geh', trockne die Tränen"}, {"n": 359, "t": "Darfst du fürchten?"}, {"n": 360, "t": "Ein lieblicher Gedanke"}, {"n": 361, "t": "O selig, wer Friede"}, {"n": 362, "t": "Halt’ aus, mein Herz, in Leiden"}, {"n": 363, "t": "Wenn das Kreuz scheint schwer zu tragen"}, {"n": 364, "t": "Fahre fort, fahre fort!"}, {"n": 365, "t": "Komm, lieber Heiland"}, {"n": 366, "t": "Wenn erschallt einst die Posaune"}, {"n": 367, "t": "Der müd’ und beladen."}, {"n": 368, "t": "Lasst mich gehen"}, {"n": 369, "t": "Nach der Heimat süßer Ruh"}, {"n": 370, "t": "Am Jordansufer stehe ich"}, {"n": 371, "t": "Jerusalem, mein himmlisch Heim"}, {"n": 372, "t": "Himmelwärts!"}, {"n": 373, "t": "Du Stadt mit Jaspermauern schön"}, {"n": 374, "t": "Herrliches, liebliches Zion"}, {"n": 375, "t": "Ich weiß ein Land voll Lieb’ und Licht"}, {"n": 376, "t": "Wo ein Altar stehet"}, {"n": 377, "t": "O, sprich ein Wort von Jesu"}, {"n": 378, "t": "Wer sind meine Brüder"}, {"n": 379, "t": "Brüder, stehet auf der Hut"}, {"n": 380, "t": "O, wie lieblich ist`s und fein"}, {"n": 381, "t": "Herz und Herz vereint zusammen"}, {"n": 382, "t": "Lasset eure Lichter brennen"}, {"n": 383, "t": "Kommt, Brüder, steht nicht stille"}, {"n": 384, "t": "Wächter, blas' des Worts Posaune!"}, {"n": 385, "t": "Volk des Herrn, erhebe dich"}, {"n": 386, "t": "Entschuld`ge dich nicht auch"}, {"n": 387, "t": "Die mit Tränen säen"}, {"n": 388, "t": "O, wo sind die Ernter der Saat der Welt"}, {"n": 389, "t": "Verheißung treu gibt Christ"}, {"n": 390, "t": "Knechte des Heilands"}, {"n": 391, "t": "Es gibt viel zu tun für Jesum"}, {"n": 392, "t": "Die Sach’ ist Dein, Herr Jesu Christ"}, {"n": 393, "t": "Wach´ auf, du Geist der ersten Zeugen"}, {"n": 394, "t": "Ruft herein, die ohne Christum"}, {"n": 395, "t": "Säe, bevor noch die Sonn’ aufgeht"}, {"n": 396, "t": "Zieht rüstig hinaus Zum heiligen Krieg"}, {"n": 397, "t": "Kommt, Lasst uns die Völker des Dunkels befreien"}, {"n": 398, "t": "Auf, denn die Nacht wird kommen"}, {"n": 399, "t": "Prächtig strahlt des Meisters Gnade"}, {"n": 400, "t": "Ein Tagwerk für den Heiland"}, {"n": 401, "t": "Von dem Strand, weit über'm Meer"}, {"n": 402, "t": "Gott, in Demut tief ergeben"}, {"n": 403, "t": "Lobsinge, getaufte Gemeinde des Herrn"}, {"n": 404, "t": "Liebster Jesu"}, {"n": 405, "t": "Da wir nun das Mahl beendet"}, {"n": 406, "t": "Erlöst durch Christum"}, {"n": 407, "t": "Schaut doch des Himmels und der Erden Herr"}, {"n": 408, "t": "Sei Du in unserm Kreise"}, {"n": 409, "t": "Dir weihen wir dies ird`sche Haus"}, {"n": 410, "t": "Jesus liebt mich ganz gewiss"}, {"n": 411, "t": "Oh Sabbatschule, schöner Ort"}, {"n": 412, "t": "Du schöne stille Andachtszeit"}, {"n": 413, "t": "Komm, o Herr, in unsre Mitte"}, {"n": 414, "t": "Wieder stehen wir hier aufs neue"}, {"n": 415, "t": "Ich kenne einen schönen Ort"}, {"n": 416, "t": "Wie herrlich und schön ist es hier!"}, {"n": 417, "t": "Jesus ist der gute Hirte"}, {"n": 418, "t": "Die Sabbatschule ruft mich heut"}, {"n": 419, "t": "Schau auf unsre Schul' hernieder"}, {"n": 420, "t": "Im Vorhof meines Herrn"}, {"n": 421, "t": "Du Sabbatschule, köstlich mir"}, {"n": 422, "t": "O Gott, sei gelobt, für die Liebe im Sohn!"}, {"n": 423, "t": "Geht hin, ihr Knechte allzumal"}, {"n": 424, "t": "Name über allen Namen"}, {"n": 425, "t": "Mit Jesu lass ich alles"}, {"n": 426, "t": "Kommt, Kinder, kommet alle her"}, {"n": 427, "t": "Wie gut muss doch der Heiland sein"}, {"n": 428, "t": "Wir stimmen einen Lobgesang."}, {"n": 429, "t": "Ich vertraue dir, Herr Jesu"}, {"n": 430, "t": "Ich bin so froh für den Trost, den Gott gibt."}, {"n": 431, "t": "Kinder, ach, wie seid ihr selig"}, {"n": 432, "t": "So lang mein Jesus lebt"}, {"n": 433, "t": "Singet schön"}, {"n": 434, "t": "Ich bin ein kleiner Krieger"}, {"n": 435, "t": "Weil ich Jesu Schäflein bin"}, {"n": 436, "t": "Kleine Tropfen Wasser"}, {"n": 437, "t": "Weißt du wie viel Sterne stehen?"}, {"n": 438, "t": "Alle, die mich frühe suchen"}, {"n": 439, "t": "Wenn der Heiland"}, {"n": 440, "t": "Komm zu dem Heiland, komme noch heut!"}, {"n": 441, "t": "Der beste Freund ist in dem Himmel"}, {"n": 442, "t": "Lieber Heiland, steh mir bei"}, {"n": 443, "t": "Seht die Lilien auf dem Feld"}, {"n": 444, "t": "Lasst die Herzen immer fröhlich"}, {"n": 445, "t": "Preis sei dir, mein teurer Heiland"}, {"n": 446, "t": "Lasst die Töne klingen"}, {"n": 447, "t": "Gesang verschönt das Leben"}, {"n": 448, "t": "Mein Heiland ruft mir zu"}, {"n": 449, "t": "Danket Gott für sein Wort"}, {"n": 450, "t": "Gott ist die Liebe"}, {"n": 451, "t": "Müde bin ich, geh´ zur Ruh"}, {"n": 452, "t": "Frischer Trank der Labe"}, {"n": 453, "t": "Sieh, wie einst im fremden Land"}, {"n": 454, "t": "Hört ihr das feindliche Grollen?"}, {"n": 455, "t": "Fröhlich hüpfend, sprudelnd, munter"}, {"n": 456, "t": "In das Land so hold und prächtig"}, {"n": 457, "t": "Wie mannigfaltig sind die Gaben"}, {"n": 458, "t": "Wir führen dir Kampf, du düstre Wacht"}, {"n": 459, "t": "Nun ruhen alle Wälder"}, {"n": 460, "t": "Sei gegrüßt du schöner Morgen!"}, {"n": 461, "t": "Wir suchen friedlich sanfte Ruh."}, {"n": 462, "t": "Hinterm Hügel sinkt die Sonne"}, {"n": 463, "t": "Erwach´ am neuen Morgen"}, {"n": 464, "t": "Nun sich der Tag geendet hat"}, {"n": 465, "t": "Wach auf, mein Herz, und singe"}, {"n": 466, "t": "Jesu Güte hat kein Ende"}, {"n": 467, "t": "Deine Harfe lass erklingen"}, {"n": 468, "t": "O, bleibe, Herr, der Abend bricht herein"}, {"n": 469, "t": "Himmelwärts"}, {"n": 470, "t": "Was macht ihr, dass ihr weinet"}, {"n": 471, "t": "Christus, der ist mein Leben"}, {"n": 472, "t": "Ich weiß, dass mein Erlöser lebt"}, {"n": 473, "t": "Im Herrn entschlafen, sel´ge Nacht"}, {"n": 474, "t": "Wenn Geliebte von uns ziehen"}, {"n": 475, "t": "Gott mit euch, bis wir uns wiederseh'n"}, {"n": 476, "t": "Bricht unsres Lebens Silberband"}, {"n": 477, "t": "So nimm denn meine Hände!"}, {"n": 478, "t": "Wer Jesus am Kreuze im Glauben erblickt"}, {"n": 479, "t": "Der Herr mein Fels und Zufluchtsort"}, {"n": 480, "t": "Heilig, heilig, heilig"}, {"n": 481, "t": "Mein Freund ist mein"}, {"n": 482, "t": "Sammeln wir am Strom uns alle"}, {"n": 483, "t": "Wenn mein Auge schaut den Heiland"}, {"n": 484, "t": "Wenn wir reisen nach Zion"}, {"n": 485, "t": "Das wird allein Herrlichkeit sein"}, {"n": 486, "t": "Wo sind deine Kinder?"}, {"n": 487, "t": "An dem Kreuz"}, {"n": 488, "t": "Wenn schwer oft das Kreuz mich will drücken"}, {"n": 489, "t": "Sabbatanbruch"}, {"n": 490, "t": "Des Königs Kind"}, {"n": 491, "t": "Hilfe leistet Gott nur"}, {"n": 492, "t": "Der beste Freund ist dem Himmel"}, {"n": 493, "t": "Wie klingt mir doch so hold und süß"}, {"n": 494, "t": "Das Wort Gottes"}, {"n": 495, "t": "Ich sende euch"}, {"n": 496, "t": "Ruhe in den ewigen Armen"}, {"n": 497, "t": "Betet!"}, {"n": 498, "t": "Du Hirte Israels"}, {"n": 499, "t": "Lasst die Lichter heller brennen!"}, {"n": 500, "t": "Jerusalem, du hoch gebaute Stadt"}, {"n": 501, "t": "Sabbatschule, schönster Ort"}, {"n": 502, "t": "Selige Gewissheit Jesus ist mein"}, {"n": 503, "t": "Herbei, o ihr Gläubigen"}, {"n": 504, "t": "Heute kehr' ich heim"}, {"n": 505, "t": "O wie süß klingt die Kunde den Pilgern"}, {"n": 506, "t": "Wenn ich Ihn nur habe"}, {"n": 507, "t": "Wenn mein Werk hier vollendet"}, {"n": 508, "t": "Ich kämpfe vorwärts Tag um Tag"}, {"n": 509, "t": "Ich weiß, dass mein Erlöser lebt"}, {"n": 510, "t": "Mein Jesus ist mein Fels und Gott"}, {"n": 511, "t": "Heut bringt der Gnadensonne Strahl"}, {"n": 512, "t": "O sel’ger Glaube, der nicht wankt"}, {"n": 513, "t": "Ihr Kinderlein kommet"}, {"n": 514, "t": "O Bruder, üb‘ Treue"}, {"n": 515, "t": "Lasst mich gehn, lasst mich gehn"}, {"n": 516, "t": "Nach dem Sturm der Regenbogen"}, {"n": 517, "t": "Wenn Christus, der Herr, zum Menschen sich neigt"}, {"n": 518, "t": "Müde der Welt, gedrückt von Sündenpein"}, {"n": 519, "t": "Lobt froh den Herrn"}, {"n": 520, "t": "Sanft und leise rufet dir"}, {"n": 521, "t": "Nicht mich, nein, Christus nur will ich erheben"}, {"n": 522, "t": "Unsern Ausgang segne Gott"}, {"n": 523, "t": "Herr, hast Du ein Werk für mich"}, {"n": 524, "t": "Mein Loblied steigt zum Himmelszelt"}, {"n": 525, "t": "Lamm, Lamm, o Lamm"}, {"n": 526, "t": "Feierlich, mit ernster Mahnung"}, {"n": 527, "t": "Mächtige Ströme des Segens!"}, {"n": 528, "t": "O vergeude nicht die goldne Morgenzeit"}, {"n": 529, "t": "Stimmt den Kampfruf an, seht, der Feind rückt an"}, {"n": 530, "t": "Einst träumte ich vom „süßen Morgen“"}, {"n": 531, "t": "Draußen auf den wilden Wogen"}, {"n": 532, "t": "Preist Ihn, preist Ihn!"}, {"n": 533, "t": "Weiß Jesus stets, wenn ein Leid mich trifft"}, {"n": 534, "t": "Wie wenn der Wind die Blätter streut"}, {"n": 535, "t": "Preis dem Lamm in Ewigkeit"}, {"n": 536, "t": "Jesu Kreuz"}, {"n": 537, "t": "Hast du die Sünde als Bürde verspüret"}, {"n": 538, "t": "In Seiner Hand"}, {"n": 539, "t": "Willst du Jesu dienen"}, {"n": 540, "t": "Hört den Pfennig fallen, wie er springt und klingt!"}, {"n": 541, "t": "Gesegnet sei das Band"}, {"n": 542, "t": "Wir sind ja nur Pilger und Fremdlinge hier"}, {"n": 543, "t": "An dem Kreuz, an dem Kreuz"}, {"n": 544, "t": "Des Himmels schönster Reim"}, {"n": 545, "t": "Drückt dich im Herzen die Sorge"}, {"n": 546, "t": "Auf Gott und nicht auf meinen Rat"}, {"n": 547, "t": "Friede, Friede so süß"}, {"n": 548, "t": "Was macht die Menschen glücklich?"}, {"n": 549, "t": "Schrecklich ist`s, den Zorn sich häufen"}, {"n": 550, "t": "Die glorreiche Ernte rückt eilend heran"}, {"n": 551, "t": "Sag' es dem Heiland"}, {"n": 552, "t": "Mein Heiland, ich lieb' Dich!"}, {"n": 553, "t": "Seht, der Strom der Zeit"}, {"n": 554, "t": "Tritt leise!"}, {"n": 555, "t": "Bin nur ein Pilgrim und muss eilen weit"}, {"n": 556, "t": "Nun, Brüder, Schwestern"}, {"n": 557, "t": "Ans Kreuz geheftet"}, {"n": 558, "t": "Zuletzt, meine Brüder, seid stark in dem Herrn!"}, {"n": 559, "t": "Das Kreuz, ein fester Turm"}, {"n": 560, "t": "Wach auf, mein Herz, und singe"}, {"n": 561, "t": "Kommt, ach kommt, ihr jungen Seelen"}, {"n": 562, "t": "An dem schönen goldnen Strand"}, {"n": 563, "t": "O welche schöne Sitte"}, {"n": 564, "t": "Näher, stets näher an Jesu Herz"}, {"n": 565, "t": "Als Israel in Gottes Wehr"}, {"n": 566, "t": "Völlige Übergabe"}, {"n": 567, "t": "Komm!"}, {"n": 568, "t": "Um heilig zu werden"}, {"n": 569, "t": "Man singet mit Freuden von Sieg"}, {"n": 570, "t": "nahen der Heimat"}, {"n": 571, "t": "Wir marschieren in die Heimat"}, {"n": 572, "t": "Siehe, das ist Gotteslamm!"}, {"n": 573, "t": "O führe mich, Dein auserwähltes Kind"}, {"n": 574, "t": "Hochzeitschor."}, {"n": 575, "t": "Überall mit Jesu!"}, {"n": 576, "t": "Weit in der Fremde irrt mein Kind"}, {"n": 577, "t": "Ich bin ein Bote hier in einem fremden Land"}, {"n": 578, "t": "In der stillen Nächte Stunden"}, {"n": 579, "t": "Komm doch zur Quelle des Lebens!"}, {"n": 580, "t": "Jesus lebt!"}, {"n": 581, "t": "Bei dem Fest des Belsazer"}, {"n": 582, "t": "Jesus, Heiland, führe Du"}, {"n": 583, "t": "Aus meines Herzens Grunde"}, {"n": 584, "t": "Dir, Dir, Jehovah will singen"}, {"n": 585, "t": "Sollt ich meinem Gott nicht singen?"}, {"n": 586, "t": "Ich will Dich lieben, meine Stärke"}, {"n": 587, "t": "Ich will von meinem Jesu singen"}, {"n": 588, "t": "Die schönste Zeit im ganzen Jahr"}, {"n": 589, "t": "O sehet doch wie heute"}, {"n": 590, "t": "Sei willkommen, Tag des Herrn"}, {"n": 591, "t": "Wie kurz sind doch die schönen Sabbatstunden"}, {"n": 592, "t": "Gott des Himmels und der Erden"}, {"n": 593, "t": "Herrlicher Sabbat ! wie lieblich und mild"}, {"n": 594, "t": "Dir, Ewiger, ist dieser Tag geweihet"}, {"n": 595, "t": "Wohin, o müder Wandrer du?"}, {"n": 596, "t": "Unsern Ausgang segne Gott"}, {"n": 597, "t": "Lass mich Dein sein und bleiben"}, {"n": 598, "t": "Dies ist der Tag, den Gott gemacht"}, {"n": 599, "t": "Herbei, o ihr Gläubigen, fröhlich triumphierend"}, {"n": 600, "t": "Macht hoch die Tür; die Tor’ macht weit"}, {"n": 601, "t": "Der Sohn, der uns erkoren"}, {"n": 602, "t": "Es ist ein Reis entsprungen aus einer Wurzel zart"}, {"n": 603, "t": "Die Gnade sei mit allen"}, {"n": 604, "t": "Der Strom des Lebens"}, {"n": 605, "t": "Ein herrlicher Stern ging auf in der Nacht"}, {"n": 606, "t": "Mit der Sehnsucht heißen Blicken"}, {"n" const list = document.getElementById('list');
const q = document.getElementById('q');
const count = document.getElementById('count');

function render(items) {
  list.innerHTML = items.map(s =>
    `<li><span class="n">${s.n}</span><span>${s.t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span></li>`
  ).join('');
  count.textContent = items.length === SONGS.length
    ? `${SONGS.length} Lieder`
    : `${items.length} von ${SONGS.length} Liedern`;
}

q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  render(!v ? SONGS : SONGS.filter(s =>
    String(s.n) === v || String(s.n).startsWith(v) || s.t.toLowerCase().includes(v)));
});

render(SONGS);
</script>
